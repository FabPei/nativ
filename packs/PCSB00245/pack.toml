# Persona 4 GOLDEN (PCSB00245, EU). Only facts about the game (the format: pipeline/packconf.py).
NAME = "Persona 4 GOLDEN"
# REGION: the release this pack plays (its content id: EP1063..., Europe)
REGION = "EU"
SPLIT = 12                # recompiled C split into this many part files (the eboot is 4.9 MB)
ELF = "eboot.bin.elf"     # the main module (the decrypted eboot)
# The game's own sce_module (libc: C runtime; libfios2: Sony's FIOS scheduler/dearchiver; libult: Sony's ULT
# task scheduler) and the firmware's GXM + GPU services (GXM runs as Sony's code) plus the font and movie
# modules the game loads (libpvf, libSceFt2, libscemp4, libsceavplayer). Import coverage checked at import.
MODULES = "libc libgxm_es4 libgpu_es4 libfios2 libult libSceFt2 libpvf libscemp4 libsceavplayer"
TEST_FRAMES = 2000      # a boot probe: the PSN prompt answered, then the title (reached 2026-11-06)
# The boot probe's taps: a v2 recording (increasing poll+ms rows) replayed by RECOMP_INPUT_REPLAY --
# NOT TEST_INPUT (that feeds RECOMP_INPUT, the legacy script path, which never reads .rec rows).
# The path is relative to the test run dir (recomp/test_win).
TEST_ENV = "RECOMP_INPUT_REPLAY=../../rec/boot-probe.rec"

