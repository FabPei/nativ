# The fork's downloads, built from this repository's source alone by GitHub's runners: dev/release.sh, as a release is
# made by hand (docs/developers.md "Making a release"), with no game anywhere: NATIV_RELEASE_SKIP_BUILDS=1 packages
# the tools without building a library's games (a runner has none; players build their own from their own copy).
#   a pushed tag fp-vX.Y.Z    the three downloads + SHA256SUMS, as a DRAFT release (published by hand after a look)
#   a push to fp/main         the same downloads as workflow artifacts only (no release): every change is built
#   Run workflow (manual)     the same, from the chosen branch (needs this file on the default branch)
#   a pull request            the tests job alone: the content check and the runtime tests (no packaging)
# Unsigned: no signing identity is configured, so Windows' SmartScreen and macOS' Gatekeeper ask the player once.
name: release
on:
  push:
    tags: ["fp-v*"]
    branches: [fp/main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  NATIV_RELEASES: ${{ github.repository }}
  NATIV_RELEASE_SKIP_BUILDS: "1"

jobs:
  # The content check (nothing from a game in the repository; every pack parses: CONTRIBUTING.md) and the runtime tests
  # that need no game, window or GPU (runtime/tests/run_ci_tests.sh): a tag only becomes a draft release when they pass.
  tests:
    runs-on: ubuntu-24.04   # (Python 3.12: the check reads the packs with tomllib, 3.11+)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: content check
        run: |
          python3 dev/tests/check_content_test.py
          python3 dev/tests/check_content.py
      - name: runtime tests
        run: bash runtime/tests/run_ci_tests.sh

  # The AppImage (made on Linux) and the Windows zip (cross-built on Linux, as upstream makes it), each in its own job so
  # they run side by side (one job did both, one after the other: 2m16s of packaging in the 3m21s of a warm run,
  # 2026-11-06). Both restore and, on a miss, build both toolchains: they share one cache entry, which must hold both.
  linux:
    runs-on: ubuntu-24.04   # (Python 3.12: the pipeline needs tomllib, 3.11+)
    if: github.event_name != 'pull_request'   # (a pull request: the tests job only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { fetch-depth: 0 }
      - name: toolchain cache
        id: tc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            ~/toolchains/ativ-linux
            ~/toolchains/ativ-win
          key: tc-linux-win-${{ hashFiles('runtime/platform/linux/setup-toolchain.sh', 'runtime/platform/win/setup-toolchain.sh', 'runtime/platform/ffmpeg/rawdec.c') }}
      - name: build dependencies
        run: |
          # (the X11/Wayland/audio development packages, cmake, ninja and nasm only build the toolchains: a cache hit
          # skips them -- and a slow mirror with them, 12.5 min on 2026-11-05)
          P="zsh rsync zip unzip xz-utils pkg-config"
          [[ "${{ steps.tc.outputs.cache-hit }}" == true ]] || P="$P cmake ninja-build nasm \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libpipewire-0.3-dev libpulse-dev libasound2-dev libdbus-1-dev \
            libudev-dev libegl-dev libgl-dev"
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends $P
      - name: toolchains
        run: |
          bash runtime/platform/linux/setup-toolchain.sh
          bash runtime/platform/win/setup-toolchain.sh
      - name: toolchain logs (on failure)
        if: failure()
        run: shopt -s nullglob; for f in ~/toolchains/ativ-*/*.log; do echo "::group::$f"; tail -60 "$f"; echo "::endgroup::"; done
      - name: launcher objects cache   # Dear ImGui's objects (launcher/build.sh build/imgui/obj_lt), the same every run
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: build/imgui/obj_lt
          key: imgui-lt-${{ hashFiles('third_party/imgui/**', 'launcher/build.sh', 'runtime/platform/linux/setup-toolchain.sh') }}
      - name: launcher objects current
        # (a checkout's sources are newer than any restored object, and launcher/build.sh compares times: the key
        # already names every input)
        run: if [[ -d build/imgui/obj_lt ]]; then find build/imgui/obj_lt -name '*.o' -exec touch {} +; fi
      - name: tag
        id: tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else t=fp-v0.0.0; git tag -f "$t"; echo "tag=$t" >> "$GITHUB_OUTPUT"; fi   # (a manual run: a throwaway local tag)
      - name: package
        env: { SHELLOPTS: xtrace }
        run: bash dev/release.sh "${{ steps.tag.outputs.tag }}" linux
      - name: launcher build trace (on failure)
        if: failure()
        run: |
          T=$(ls -d build/release/*/work-linux/ProjectNativ/toolchain | head -1)
          ATIV_LINUX_TOOLCHAIN=$PWD/$T zsh -x launcher/build.sh /tmp/nativ-trace 2>&1 | tail -80
      - name: smoke
        run: |
          A=$(ls build/release/*/ProjectNativ-*-linux.AppImage); chmod +x "$A"
          "$A" --appimage-extract >/dev/null
          squashfs-root/python/bin/python3 -c "import capstone, Crypto; print('install python ok')"
          test -x squashfs-root/launcher/nativ && test -f squashfs-root/toolchain/ffmpeg/lib/libnativ_rawdec.a
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: linux
          path: build/release/*/ProjectNativ-*-linux.AppImage
          if-no-files-found: error

  windows:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'   # (a pull request: the tests job only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { fetch-depth: 0 }
      - name: toolchain cache
        id: tc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            ~/toolchains/ativ-linux
            ~/toolchains/ativ-win
          key: tc-linux-win-${{ hashFiles('runtime/platform/linux/setup-toolchain.sh', 'runtime/platform/win/setup-toolchain.sh', 'runtime/platform/ffmpeg/rawdec.c') }}
      - name: build dependencies
        run: |
          P="zsh rsync zip unzip xz-utils pkg-config"
          [[ "${{ steps.tc.outputs.cache-hit }}" == true ]] || P="$P cmake ninja-build nasm \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libpipewire-0.3-dev libpulse-dev libasound2-dev libdbus-1-dev \
            libudev-dev libegl-dev libgl-dev"
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends $P
      - name: toolchains
        run: |
          bash runtime/platform/linux/setup-toolchain.sh
          bash runtime/platform/win/setup-toolchain.sh
      - name: toolchain logs (on failure)
        if: failure()
        run: shopt -s nullglob; for f in ~/toolchains/ativ-*/*.log; do echo "::group::$f"; tail -60 "$f"; echo "::endgroup::"; done
      - name: launcher objects cache   # (launcher/build.sh build/imgui/obj_win)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: build/imgui/obj_win
          key: imgui-win-${{ hashFiles('third_party/imgui/**', 'launcher/build.sh', 'runtime/platform/win/setup-toolchain.sh', 'runtime/platform/win32_compat.h') }}
      - name: launcher objects current
        run: if [[ -d build/imgui/obj_win ]]; then find build/imgui/obj_win -name '*.o' -exec touch {} +; fi
      - name: tag
        id: tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else t=fp-v0.0.0; git tag -f "$t"; echo "tag=$t" >> "$GITHUB_OUTPUT"; fi
      - name: package
        env: { SHELLOPTS: xtrace }
        run: bash dev/release.sh "${{ steps.tag.outputs.tag }}" windows
      - name: smoke
        run: |
          unzip -l build/release/*/ProjectNativ-*-windows.zip | grep -q "ProjectNativ/Project Nativ.exe"
          unzip -l build/release/*/ProjectNativ-*-windows.zip | grep -q "ProjectNativ/packs/PCSF00532/pack.toml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: windows
          path: build/release/*/ProjectNativ-*-windows.zip
          if-no-files-found: error

  mac:   # the .dmg (made on a Mac: Apple silicon, macOS 11 and later)
    runs-on: macos-15
    if: github.event_name != 'pull_request'   # (a pull request: the tests job only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { fetch-depth: 0 }
      - name: build dependencies
        run: brew install ninja
      - name: toolchain cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: ~/toolchains/ativ-mac
          key: tc-mac-${{ hashFiles('runtime/platform/macos/setup-toolchain.sh', 'runtime/platform/ffmpeg/rawdec.c') }}
      - name: toolchain
        run: bash runtime/platform/macos/setup-toolchain.sh
      - name: toolchain logs (on failure)
        if: failure()
        run: shopt -s nullglob; for f in ~/toolchains/ativ-mac/*.log; do echo "::group::$f"; tail -60 "$f"; echo "::endgroup::"; done
      - name: tag
        id: tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else t=fp-v0.0.0; git tag -f "$t"; echo "tag=$t" >> "$GITHUB_OUTPUT"; fi
      - name: package
        env: { SHELLOPTS: xtrace }   # (every script line in the log: the install scripts end quietly on a failure)
        run: bash dev/release.sh "${{ steps.tag.outputs.tag }}" mac
      - name: launcher build trace (on failure)
        if: failure()
        run: |
          T=$(ls -d "build/release/"*"/work-mac/Project Nativ.app/Contents/Resources/toolchain" | head -1)
          ATIV_MAC_TOOLCHAIN="$PWD/$T" zsh -x launcher/build.sh /tmp/nativ-trace 2>&1 | tail -80
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: mac
          path: build/release/*/ProjectNativ-*-mac.dmg
          if-no-files-found: error

  draft-release:   # only for a pushed tag: every download and SHA256SUMS on a draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [tests, linux, windows, mac]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with: { path: dl, merge-multiple: true }
      - name: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir out; find dl -type f -name "ProjectNativ-$TAG-*" -exec mv {} out/ \;
          (cd out && sha256sum ProjectNativ-* > SHA256SUMS && cat SHA256SUMS)
          cat > notes.md <<NOTES
          Unofficial build of the [FabPei/nativ](https://github.com/${{ github.repository }}) fork of
          [Project Nativ](https://github.com/TheLostPantheon/nativ), made by GitHub Actions from tag \`$TAG\`
          ([source](https://github.com/${{ github.repository }}/tree/$TAG)). No game is included: you bring your own copy.
          Unsigned: Windows and macOS ask once before the first start. Licences: \`LICENSE\` (GPL-2.0-or-later) and
          \`THIRD_PARTY.md\` in each download.
          NOTES
          gh release create "$TAG" out/* --repo "${{ github.repository }}" --draft --prerelease --title "Project Nativ FP ${TAG#fp-v} (unofficial fork)" --notes-file notes.md
