name: Bug report
description: Something in a game or the launcher doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Two files make a report reproducible: the launcher's `session.log` and an input
        recording (`.rec`) of the session where the problem happened
        ([how to record one](https://github.com/FabPei/nativ/blob/fp/main/docs/input-recording.md)).

        **Never attach game files, firmware, keys, decrypted modules, or saves that contain personal data.**
        Logs, input recordings and hashes are enough.
  - type: input
    id: game
    attributes:
      label: Game title ID and version
      description: The title ID shown in the launcher, and the game's version.
      placeholder: PCSF00532, v1.00
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Nativ release tag
      description: The release you ran (from the GitHub release page or the launcher's About view).
      placeholder: fp-v0.2.0
    validations:
      required: true
  - type: input
    id: computer
    attributes:
      label: Your computer
      description: The operating system and its version, and the GPU (and CPU if you know them).
      placeholder: Windows 11, NVIDIA RTX 3070
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: Where in the game, and what you did just before. Does it happen every time?
  - type: textarea
    id: logs
    attributes:
      label: session.log and input recording
      description: Drag the launcher's `session.log` and the session's `.rec` input recording here. Over 25 MB, share a link instead of the file.
