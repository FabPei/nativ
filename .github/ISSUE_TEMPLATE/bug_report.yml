name: Launcher or tools bug
description: The launcher, setup, adding a game, building or another tool doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a problem inside a running game, use **Game bug**; for how far a game gets, **Game report**.

        **Never attach or link game files, firmware, keys or saves.** The launcher's **Report a problem…** zip holds only logs, settings and any F5 pictures. Requests for game files are closed.
  - type: checkboxes
    id: searched
    attributes:
      label: Existing issues
      options:
        - label: I [searched the open and closed issues](https://github.com/FabPei/nativ/issues?q=is%3Aissue) for this problem.
          required: true
  - type: input
    id: release
    attributes:
      label: Nativ release
      description: The release you downloaded (or, in a game, F10 → Help → About).
      placeholder: fp-v0.2.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options: [Windows, Linux, Steam Deck, macOS]
    validations:
      required: true
  - type: input
    id: computer
    attributes:
      label: Your computer
      description: The OS version and the GPU (and the CPU if you know it). If a game starts, F10 → Help → Copy system info gives all of it.
      placeholder: Windows 11 24H2, NVIDIA RTX 3070
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game (if one is involved)
      description: Its title ID and version.
      placeholder: PCSE00764, 1.01
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw (the exact message, if any), and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps from starting the launcher. Does it happen every time?
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The launcher's **Report a problem…** zip (the game's ⋯ menu), or its `launcher.log`. Over 25 MB, share a link instead.
